name: Source Cooperative
on:
  workflow_dispatch:  # by hand, from the Actions tab

env:
  # Configures AWS CLI/SDKs to use Source Cooperative's data proxy.
  AWS_ENDPOINT_URL: https://data.source.coop

jobs:
  data:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      contents: read
    steps:
      # TODO(live demo): swap in the real role ARN.
      - name: Sign in to Source Cooperative as alukach--source-experiments
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::alukach--source-demo:role/FullAccess
          audience: ${{ env.AWS_ENDPOINT_URL }}
          sts-endpoint: ${{ env.AWS_ENDPOINT_URL }}/.sts
          aws-region: us-west-2

      # From here on, any AWS SDK/CLI acts as alukach--source-experiments.
      - name: Write data
        run: |
          echo "Hello from ${{ github.repository }} run ${{ github.run_id }} at $(date -u +%FT%TZ)" > hello.txt
          aws s3 cp hello.txt s3://alukach/alukach-experimentation/github-actions/run-${{ github.run_id }}.txt

      - name: List product contents
        run: aws s3 ls s3://alukach/alukach-experimentation
